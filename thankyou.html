<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Atlas Management Consulting</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a2332;--slate:#45526b;--accent:#2f5d78}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fa;color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;text-align:center;padding:24px}
  .card{background:#fff;border:1px solid #e6e9ee;border-radius:16px;padding:56px 44px;max-width:520px}
  .mark{width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;
    font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 auto 24px}
  h1{font-family:'Fraunces',Georgia,serif;font-size:32px;margin:0 0 14px;letter-spacing:-.01em}
  p{color:var(--slate);font-size:17px;margin:0 0 28px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:13px 28px;border-radius:8px;font-weight:600;font-size:15px}
  a.btn:hover{background:#264c63}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">A</div>
    <h1>Thank you — message received.</h1>
    <p>Thanks for reaching out to Atlas Management Consulting. We’ll review your note and get back
       to you soon. If it’s time-sensitive, feel free to call us at (408) 528-2226.</p>
    <a href="index.html" class="btn">Back to home</a>
  </div>
</body>
</html>
